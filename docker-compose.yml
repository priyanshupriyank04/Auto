services:  # The LIVE Trading Bot
  bot:
    build: .
    container_name: hl-breakout-bot
    command: ["python", "-m", "src.run_breakout_live"]
    restart: on-failure
    env_file:
      - secrets/.env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./secrets:/app/secrets
      - ./config:/app/config
    environment:
      - PYTHONPATH=/app
      - TZ=Asia/Kolkata

  # The Dashboard
  dashboard:
    build: .
    container_name: hl-breakout-dashboard
    command: ["streamlit", "run", "src/dashboard/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    restart: always
    env_file:
      - secrets/.env
    ports:
      - "18501:8501"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
      - TZ=Asia/Kolkata
    depends_on:
      - bot

  # Ngrok for remote access
  ngrok:
    image: ngrok/ngrok:latest
    container_name: hl-breakout-ngrok
    restart: always
    env_file:
      - secrets/.env
    command:
      - http
      - dashboard:8501
    ports:
      - "14040:4040"
    depends_on:
      - dashboard
